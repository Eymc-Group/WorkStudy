<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - WorkStudy</title>

    <link rel="icon" href="../img/favicon.png">
    <link rel="stylesheet" href="../css/style.css">

    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>

    <script src="../js/auth.js" defer></script>
    <script src="../js/color.js" defer></script>
    <script src="../js/customTab.js" defer></script>
</head>

<body>

    <form
        id="signupForm"
        class="auth-container"
        novalidate
    >
        <h1>📝 Sign Up</h1>

        <input
            id="username"
            name="username"
            type="text"
            placeholder="Username"
            autocomplete="username"
            minlength="3"
            maxlength="32"
            required
        >

        <input
            id="email"
            name="email"
            type="email"
            placeholder="Email Address"
            autocomplete="email"
            maxlength="254"
            required
        >

        <input
            id="password"
            name="password"
            type="password"
            placeholder="Password"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            required
        >

        <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="Confirm Password"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            required
        >

        <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAAFhMfDnfOmB6YAzQ">
        </div>

        <button id="signupBtn" type="submit">
            Create Account
        </button>

        <div
            id="status"
            role="status"
            aria-live="polite">
        </div>

        <div class="links">
            Already have an account?
            <a href="login.html">Login</a>

            <br><br>

            <a href="../index.html">🏠 Home</a>
        </div>
    </form>

    <script>
        "use strict";

        const signupForm =
            document.getElementById("signupForm");

        const usernameInput =
            document.getElementById("username");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const signupButton =
            document.getElementById("signupBtn");

        const statusElement =
            document.getElementById("status");

        function setStatus(message) {
            statusElement.textContent = message;
        }

        function resetTurnstile() {
            if (
                window.turnstile &&
                typeof window.turnstile.reset === "function"
            ) {
                window.turnstile.reset();
            }
        }

        async function signupUser(event) {
            event.preventDefault();

            const username =
                usernameInput.value.trim();

            const email =
                emailInput.value.trim().toLowerCase();

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;

            if (!username) {
                setStatus("Enter a username.");
                usernameInput.focus();
                return;
            }

            if (
                username.length < 3 ||
                username.length > 32
            ) {
                setStatus(
                    "Username must be between 3 and 32 characters."
                );

                usernameInput.focus();
                return;
            }

            if (!/^[a-zA-Z0-9_-]+$/.test(username)) {
                setStatus(
                    "Username may contain only letters, numbers, underscores, and hyphens."
                );

            atus("Enter an email address.");
                emailInput.focus();
                return;
            }

            if (!emailInput.validity.valid) {
                setStatus("Enter a valid email address.");
                emailInput.focus();
                return;
            }

            if (!password) {
                setStatus("Enter a password.");
                passwordInput.focus();
                return;
            }

            if (
                password.length < 8 ||
                password.length > 128
            ) {
                setStatus(
                    "Password must be between 8 and 128 characters."
                );

                passwordInput.focus();
                return;
            }

            if (password !== confirmPassword) {
                setStatus("Passwords do not match.");
                confirmPasswordInput.focus();
                return;
            }

            if (
                !window.turnstile ||
                typeof window.turnstile.getResponse !== "function"
            ) {
                setStatus(
                    "Turnstile is still loading. Try again."
                );

                return;
            }

            const turnstileToken =
                window.turnstile.getResponse();

            if (!turnstileToken) {
                setStatus(
                    "Please complete the Turnstile verification."
                );

                return;
            }

            signupButton.disabled = true;
            setStatus("Creating account...");

            try {
                const response = await fetch(
                    "https://workstudy-api.354271744.workers.dev/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username,
                            email,
                            password,
                            token: turnstileToken
                        })
                    }
                );

                let data;

                try {
                    data = await response.json();
                } catch {
                    throw new Error(
                        "The server returned an invalid response."
                    );
                }

                if (!response.ok || !data.success) {
                    setStatus(
                        data.message ||
                        "Unable to create the account."
                    );

                    resetTurnstile();
                    return;
                }

                const account = {
                    username: data.username || username,
                    email: data.email || email
                };

                let sessionSaved = false;

                if (
                    window.WorkStudyAuth &&
                    typeof window.WorkStudyAuth.setCurrentUser === "function"
                ) {
                    sessionSaved =
                        window.WorkStudyAuth.setCurrentUser(
                            account
                        );
                }

                if (!sessionSaved) {
                    localStorage.setItem(
                        "workstudy-user",
                        JSON.stringify(account)
                    );
                }

                localStorage.setItem(
                    "workstudy-account",
                    JSON.stringify(account)
                );

                if (data.token) {
                    localStorage.setItem(
                        "workstudy-token",
                        data.token
                    );
                } else {
                    localStorage.removeItem(
                        "workstudy-token"
                    );
                }

                setStatus(
                    "Account created successfully!"
                );

                setTimeout(function () {
                    window.location.href =
                        "../index.html";
                }, 1000);

            } catch (error) {
                console.error(
                    "Registration failed:",
                    error
                );

                setStatus(
                    error.message ||
                    "Connection failed."
                );

                resetTurnstile();

            } finally {
                signupButton.disabled = false;
            }
        }

        signupForm.addEventListener(
            "submit",
            signupUser
        );
    </script>

</body>
</html>
