<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - WorkStudy</title>

    <link rel="icon" href="../img/favicon.png">
    <link rel="stylesheet" href="../css/style.css">

    <script src="../js/auth.js" defer></script>
    <script src="../js/color.js" defer></script>
</head>

<body>
    <div class="auth-container">
        <h1>🔐 Login</h1>

        <input
            id="login"
            type="text"
            placeholder="Username or Email"
            autocomplete="username"
            maxlength="254"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            maxlength="128"
        >

        <button
            id="loginBtn"
            type="button"
            onclick="loginUser()"
        >
            Login
        </button>

        <div
            id="status"
            role="status"
            aria-live="polite"
        ></div>

        <div class="links">
            Don't have an account?
            <a href="signup.html">Sign Up</a>

            <br><br>

            <a href="../index.html">🏠 Home</a>
        </div>
    </div>

    <script>
        "use strict";

        async function loginUser() {
            const loginInput =
                document.getElementById("login");

            const passwordInput =
                document.getElementById("password");

            const loginButton =
                document.getElementById("loginBtn");

            const statusElement =
                document.getElementById("status");

            const login =
                loginInput.value.trim();

            const password =
                passwordInput.value;

            if (!login) {
                statusElement.textContent =
                    "Enter a username or email.";

                loginInput.focus();
                return;
            }

            if (!password) {
                statusElement.textContent =
                    "Enter a password.";

                passwordInput.focus();
                return;
            }

            loginButton.disabled = true;
            statusElement.textContent =
                "Logging in...";

            try {
                const response = await fetch(
                    "https://workstudy-api.354271744.workers.dev/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username: login,
                            password: password
                        })
                    }
                );

                const responseText =
                    await response.text();

                let data;

                try {
                    data = JSON.parse(responseText);
                } catch {
                    throw new Error(
                        "The API returned invalid JSON."
                    );
                }

                if (!response.ok || !data.success) {
                    statusElement.textContent =
                        data.message || "Login failed.";

                              "The API did not return a login token."
                    );
                }

                const account = {
                    username:
                        data.username || login,
                    email:
                        data.email || null
                };

                let sessionSaved = false;

                if (
                    window.WorkStudyAuth &&
                    typeof window.WorkStudyAuth.setCurrentUser ===
                        "function"
                ) {
                    sessionSaved =
                        window.WorkStudyAuth.setCurrentUser(
                            account
                        );
                }

                if (!sessionSaved) {
                    localStorage.setItem(
                        "workstudy-user",
                        JSON.stringify(account)
                    );
                }

                localStorage.setItem(
                    "workstudy-account",
                    JSON.stringify(account)
                );

                localStorage.setItem(
                    "workstudy-token",
                    data.token
                );

                statusElement.textContent =
                    "Login successful!";

                setTimeout(function () {
                    window.location.href =
                        "../index.html";
                }, 1000);

            } catch (error) {
                console.error(
                    "Login request failed:",
                    error
                );

                statusElement.textContent =
                    error.message ||
                    "Connection failed.";

            } finally {
                loginButton.disabled = false;
            }
        }

        document.addEventListener(
            "keydown",
            function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    loginUser();
                }
            }
        );
    </script>
</body>
</html>
