<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="../img/favicon.png">
  <script src="../js/customTab.js" data-title="Shorts — WorkStudy" data-icon="../img/favicon.png" defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f0f0f;
      --bg2: #212121;
      --text: #f1f1f1;
      --muted: #aaa;
      --accent: #ff0000;
      --radius: 12px;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Roboto', system-ui, sans-serif;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      z-index: 100;
      border-bottom: 1px solid #333;
    }
    #topbar .logo {
      display: flex; align-items: center; gap: 6px;
      font-size: 18px; font-weight: 700; color: var(--text);
      text-decoration: none;
    }
    #topbar .logo span { color: #ff0000; }
    #search-bar {
      flex: 1;
      display: flex;
      align-items: center;
      background: #121212;
      border: 1px solid #3f3f3f;
      border-radius: 20px;
      padding: 6px 14px;
      gap: 8px;
    }
    #search-bar input {
      flex: 1; border: none; background: transparent;
      color: var(--text); font-size: 14px; outline: none;
    }
    #search-bar button {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 15px; padding: 0;
    }
    #home-btn {
      background: none; border: none;
      color: var(--muted); font-size: 20px;
      cursor: pointer; padding: 4px 6px; border-radius: 50%;
      transition: background .15s;
    }
    #home-btn:hover { background: #333; }

    /* ── Tabs ── */
    #tabs {
      position: fixed;
      top: 52px; left: 0; right: 0;
      height: 42px;
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 0;
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 99;
      border-bottom: 1px solid #333;
      padding: 0 8px;
    }
    #tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      padding: 8px 14px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
    }
    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    /* ── Shorts feed ── */
    #feed {
      position: fixed;
      top: 94px; bottom: 0; left: 0; right: 0;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    #feed::-webkit-scrollbar { display: none; }

    .short-slide {
      height: calc(100vh - 94px);
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
    }

    /* Shorts (vertical 9:16) */
    .short-slide iframe {
      height: 100%;
      width: min(100%, calc((100vh - 94px) * 9 / 16));
      border: none;
      display: block;
    }

    /* Wide videos (16:9) */
    .short-slide.wide-video iframe {
      height: auto;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 100%;
    }

    /* ── Side action buttons ── */
    .side-actions {
      position: absolute;
      right: 12px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .action-btn .icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      transition: background .15s;
    }
    .action-btn:hover .icon { background: rgba(255,255,255,0.3); }
    .action-btn span { font-size: 11px; font-weight: 600; }

    /* ── Video info overlay ── */
    .short-info {
      position: absolute;
      bottom: 24px;
      left: 12px;
      right: 70px;
      z-index: 10;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    .short-info .channel {
      font-size: 14px; font-weight: 700; margin-bottom: 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .short-info .title {
      font-size: 13px; color: rgba(255,255,255,0.85);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .sub-btn {
      padding: 4px 10px;
      border-radius: 20px;
      border: none;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ── Nav arrows (desktop) ── */
    #nav-prev, #nav-next {
      position: fixed;
      right: 70px;
      z-index: 101;
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 18px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
      backdrop-filter: blur(4px);
    }
    #nav-prev { bottom: calc(50% + 24px); }
    #nav-next { bottom: calc(50% - 64px); }
    #nav-prev:hover, #nav-next:hover { background: rgba(255,255,255,0.3); }

    /* ── Counter ── */
    #counter {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      z-index: 101;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      #nav-prev, #nav-next { display: none; }
    }
  </style>

// ── State ──────────────────────────────────────────────────────────────────
let currentTab = "trending";
let currentVideos = [];
let currentIndex = 0;

// ── Build a short slide ────────────────────────────────────────────────────
function buildSlide(video, index) {
  const slide = document.createElement("div");
  slide.className = "short-slide";
  slide.dataset.index = index;
  // Mark widescreen videos so CSS can apply different aspect ratio
  if (!video.short) slide.classList.add("wide-video");

  // YouTube embed — no autoplay for unloaded slides (lazy)
  const iframe = document.createElement("iframe");
  iframe.title = video.title;
  iframe.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media; accelerometer; clipboard-write; gyroscope; web-share";
  iframe.setAttribute("allowfullscreen", "");
  iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
  // No sandbox! Required for YT to work
  const params = `autoplay=0&loop=1&playlist=${video.id}&modestbranding=1&rel=0&controls=1`;
  iframe.src = `https://www.youtube.com/embed/${video.id}?${params}`;
  iframe.dataset.id = video.id;

  // Side actions
  const actions = document.createElement("div");
  actions.className = "side-actions";
  actions.innerHTML = `
    <button class="action-btn" onclick="toggleLike(this)">
      <div class="icon">👍</div><span class="like-count">${(Math.floor(Math.random()*900)+100)}K</span>
    </button>
    <button class="action-btn">
      <div class="icon">👎</div><span>Dislike</span>
    </button>
    <button class="action-btn" onclick="shareShort('${video.id}')">
      <div class="icon">↗️</div><span>Share</span>
    </button>
    <button class="action-btn" onclick="openOnYT('${video.id}')">
      <div class="icon" style="font-size:14px;">▶ YT</div><span>Open</span>
    </button>
    <button class="action-btn" onclick="toggleFullscreen()">
      <div class="icon">⛶</div><span>Full</span>
    </button>
  `;

  // Info
  const info = document.createElement("div");
  info.className = "short-info";
  info.innerHTML = `
    <div class="channel">${video.channel} <button class="sub-btn">Subscribe</button></div>
    <div class="title">${video.title}</div>
  `;

  slide.append(iframe, actions, info);
  return slide;
}

function loadTab(tab) {
  currentTab = tab;
  currentVideos = TABS[tab] || [];
  currentIndex = 0;

  // Update tab buttons
  document.querySelectorAll(".tab-btn").forEach(b => {
    b.classList.toggle("active", b.textContent.toLowerCase().includes(tab) ||
      (tab === "satisfying" && b.textContent.includes("✨")) ||
      (tab === "trending" && b.textContent.includes("🔥")) ||
      (tab === "gaming" && b.textContent.includes("🎮")) ||
      (tab === "music" && b.textContent.includes("🎵")) ||
      (tab === "comedy" && b.textContent.includes("😂")) ||
      (tab === "sports" && b.textContent.includes("⚽")) ||
      (tab === "tech" && b.textContent.includes("💻"))
    );
  });

  // Build feed
  const feed = document.getElementById("feed");
  feed.innerHTML = "";
  currentVideos.forEach((v, i) => feed.appendChild(buildSlide(v, i)));

  // Auto-play first
  setTimeout(() => {
    const first = feed.querySelector(".short-slide");
    if (first) {
      const iframe = first.querySelector("iframe");
      iframe.src = iframe.src.replace("autoplay=0", "autoplay=1");
    }
    updateCounter();
  }, 100);
}

function updateCounter() {
  const slides = document.querySelectorAll(".short-slide");
  let visible = 0;
  const feed = document.getElementById("feed");
  const scrollTop = feed.scrollTop;
  const height = feed.clientHeight;
  slides.forEach((s, i) => {
    if (Math.abs(s.offsetTop - scrollTop) < height / 2) visible = i;
  });
  currentIndex = visible;
  document.getElementById("counter").textContent = `${visible + 1} / ${slides.length}`;
}

// Scroll snap observer — auto-play visible short
const feedEl = document.getElementById("feed");
let scrollTimer;
feedEl.addEventListener("scroll", () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    updateCounter();
    // Autoplay visible slide
    const slides = document.querySelectorAll(".short-slide");
    slides.forEach((s, i) => {
      const iframe = s.querySelector("iframe");
      if (!iframe) return;
      const dist = Math.abs(s.offsetTop - feedEl.scrollTop);
      const isVisible = dist < feedEl.clientHeight / 2;
      const src = iframe.src;
      if (isVisible && src.includes("autoplay=0")) {
        iframe.src = src.replace("autoplay=0", "autoplay=1");
      }
    });
  }, 150);
});

function prevShort() {
  currentIndex = Math.max(0, currentIndex - 1);
  const slides = document.querySelectorAll(".short-slide");
  if (slides[currentIndex]) {
    slides[currentIndex].scrollIntoView({ behavior: "smooth" });
  }
}

function nextShort() {
  const slides = document.querySelectorAll(".short-slide");
  currentIndex = Math.min(slides.length - 1, currentIndex + 1);
  if (slides[currentIndex]) {
    slides[currentIndex].scrollIntoView({ behavior: "smooth" });
  }
}

function searchYT() {
  const q = document.getElementById("search-input").value.trim();
  if (!q) return;
  window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(q) + "&sp=EgIYAQ%253D%253D", "_blank");
}

function toggleLike(btn) {
  const icon = btn.querySelector(".icon");
  icon.textContent = icon.textContent === "👍" ? "💙" : "👍";
}

function shareShort(id) {
  const url = "https://youtube.com/shorts/" + id;
  if (navigator.share) {
    navigator.share({ title: "Check out this Short!", url });
  } else {
    navigator.clipboard?.writeText(url).then(() => alert("Link copied!"));
  }
}

function openOnYT(id) {
  window.open("https://youtube.com/shorts/" + id, "_blank");
}

function toggleFullscreen() {
  const feed = document.getElementById("feed");
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    feed.requestFullscreen?.();
  }
}

// Keyboard nav
document.addEventListener("keydown", e => {
  if (e.key === "ArrowUp") prevShort();
  if (e.key === "ArrowDown") nextShort();
});

// Init
loadTab("trending");
</script>
