<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Iframe</title>

    <link rel="icon" href="../img/website.png">

    <script src="../js/color.js" defer></script>
    <script src="../js/iframe.js" defer></script>
    <script src="../js/website.js" defer></script>
    <script src="../js/customTab.js" defer></script>
    <script>
function openWebsiteNewTab() {
    const frame = document.getElementById("websiteFrame");

    if (!frame || !frame.src) {
        alert("No website is currently loaded.");
        return;
    }

    const title =
        document.title ||
        "Website Viewer";

    const favicon =
        document.querySelector("link[rel*='icon']")?.href ||
        "";

    const w = window.open("about:blank", "_blank");

    if (!w) {
        alert("Popup blocked.");
        return;
    }

    w.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>${title}</title>
            ${favicon ? `<link rel="icon" href="${favicon}">` : ""}
            <style>
                html, body {
                    margin: 0;
                    width: 100%;
                    height: 100%;
                    overflow: hidden;
                    background: #000;
                }

                iframe {
                    width: 100%;
                    height: 100%;
                    border: 0;
                }
            </style>
        </head>
        <body>
            <iframe
                src="${frame.src}"
                allowfullscreen>
            </iframe>
        </body>
        </html>
    `);

    w.document.close();
}
</script>
    <script>
      function customTabOpener() {
    const url = prompt("Enter a website URL:");

    if (!url) return;

    let validUrl;

    try {
        validUrl = new URL(
            url.startsWith("http") ? url : "https://" + url
        );
    } catch {
        alert("Invalid URL.");
        return;
    }

    const w = window.open("about:blank", "_blank");

    if (!w) {
        alert("Popup blocked.");
        return;
    }

    const title =
        document.title || "Website";

    const favicon =
        document.querySelector("link[rel*='icon']")?.href || "";

    w.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>${title}</title>
            ${favicon ? `${favicon}` : ""}
            <style>
                html, body {
                    margin: 0;
                    width: 100%;
                    height: 100%;
                    overflow: hidden;
                    background: #000;
                }

                iframe {
                    width: 100%;
                    height: 100%;
                    border: 0;
                }
            </style>
        </head>
        <body>
            ${validUrl.href}
            </iframe>
        </body>
        </html>
    `);

    w.document.close();
}  
    </script>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        #savedSites {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            justify-content: center;
        }

        .website-item {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .website-item:hover {
            opacity: 0.9;
        }

        #websiteFrame {
            width: 100%;
            height: calc(100vh - 220px);
            border: none;
        }
    </style>
</head>
<body>

    <div class="welcome">
        <h1>Website Iframe</h1>
        <p>Enter a website URL below to view it inside an iframe.</p>
    </div>

    <div class="topbar">
        <input
            type="text"
            id="urlInput"
            placeholder="https://example.com">

        <button type="button" onclick="loadWebsite()">
            👇 Open
        </button>

        <button type="button" onclick="saveCurrentWebsite()">
            ⭐ Save
        </button>

        <button type="button" onclick="location.href='../index.html'">
            🏠 Home
        </button>
        
        <button type="button" onclick="openWebsiteNewTab()">
            🗔 Open In New Tab
        </button>

        <button onclick="customTabOpener()">
            🌐 Open Custom URL
        </button>    
        
    </div>
    
    <div id="savedSites"></div>

    <iframe
        id="websiteFrame"
        title="Website Preview">
    </iframe>

</body>
</html>
