<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Login - WorkStudy</title>
    <link rel="icon" href="../img/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/color.js" defer></script>
</head>
<body>
    <div class="auth-container">
        <h1>🔗 GitHub</h1>
        <div id="status" role="status" aria-live="polite">Finishing sign-in...</div>
    </div>

    <script>
        "use strict";

        const API = "https://workstudy-api.354271744.workers.dev";

        function setStatus(msg) {
            document.getElementById("status").textContent = msg;
        }

        function redirect() {
            window.location.href = "../index.html";
        }

        async function handleCallback() {
            const params = new URLSearchParams(window.location.search);
            const code   = params.get("code");
            const error  = params.get("error");

            if (error || !code) {
                setStatus("GitHub sign-in was cancelled or failed.");
                setTimeout(redirect, 2000);
                return;
            }

            const intent    = sessionStorage.getItem("gh-oauth-intent") || "login";
            const linkToken = sessionStorage.getItem("gh-link-token")   || null;

            sessionStorage.removeItem("gh-oauth-intent");
            sessionStorage.removeItem("gh-link-token");

            // Pick the right endpoint
            let endpoint;
            const headers = { "Content-Type": "application/json" };

            if (intent === "link" && linkToken) {
                endpoint = API + "/auth/github/link";
                headers["Authorization"] = "Bearer " + linkToken;
            } else if (intent === "signup") {
                endpoint = API + "/auth/github/signup";
            } else {
                endpoint = API + "/auth/github/callback";
            }

            setStatus("Contacting server...");

            try {
                const res  = await fetch(endpoint, {
                    method: "POST",
                    headers,
                    body: JSON.stringify({ code })
                });

                let data;
                try { data = await res.json(); }
                catch { throw new Error("Invalid server response."); }

                if (!res.ok || !data.success) {
                    setStatus(data.message || "GitHub sign-in failed.");
                    setTimeout(redirect, 2500);
                    return;
                }

                // Save session
                if (data.token) {
                    localStorage.setItem("workstudy-token", data.token);
                }

                if (data.username || data.email) {
                    const account = {
                        username: data.username || "",
                        email:    data.email    || ""
                    };
                    localStorage.setItem("workstudy-account", JSON.stringify(account));
                    localStorage.setItem("workstudy-user",    JSON.stringify(account));
                }

                setStatus(intent === "link" ? "GitHub linked!" : "Signed in!");
                setTimeout(redirect, 800);

            } catch (err) {
                console.error("GitHub callback error:", err);
                setStatus(err.message || "Connection failed.");
                setTimeout(redirect, 2500);
            }
        }

        handleCallback();
    </script>
</body>
</html>
