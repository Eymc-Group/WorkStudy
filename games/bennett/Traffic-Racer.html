  <script>var loadingText = document.querySelector("#loading-text");
    let totalBytes = 0;
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const {
          done,
          value
        } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        let mbTotal = '87.7';
        loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }
    async function mergeFiles(fileParts, cacheKey) {
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
       const mergedBlob = new Blob(buffers);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }

<div id="ws-offline-overlay">
  <div style="font-size:56px;">✈️</div>
  <h2>You're Offline</h2>
  <p>This game needs internet to load its assets. Connect to Wi-Fi and reload, or open a game that has been saved offline.</p>
  <button onclick="location.reload()">🔄 Retry</button>
</div>
<script>
(function() {
  function checkOffline() {
    if (!navigator.onLine) {
      document.getElementById('ws-offline-overlay').classList.add('show');
    }
  }
  checkOffline();
  window.addEventListener('offline', function() {
    document.getElementById('ws-offline-overlay').classList.add('show');
  });
  window.addEventListener('online', function() {
    document.getElementById('ws-offline-overlay').classList.remove('show');
  });
  // For iframe-based games: detect load failure
  var frames = document.querySelectorAll('iframe[src]');
  frames.forEach(function(f) {
    var src = f.getAttribute('src');
    if (!src || src.startsWith('data:')) return;
    // If offline, show overlay immediately
    if (!navigator.onLine) {
      document.getElementById('ws-offline-overlay').classList.add('show');
    }
  });
})();
</script>
