    <script>

        // support mobile ----------------------------------------------------------------
        (function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (!isMobile) {
            return;
        }
        let i = setInterval(function () {
            if (window.fullSetupComplete) {
                let zoneStatic = document.createElement("div");
                zoneStatic.style = "position: fixed; bottom: 0; left: 0; z-index: 9999; width: 500px; height: 500px;";
                let internal = document.createElement("div");
                internal.style = "position: relative; width: 100%; height: 100%;"
                zoneStatic.appendChild(internal);
                let joystick = nipplejs.create({
                    mode: 'semi',
                    zone: internal,
                    color: 'red',
                    catchDistance: 30
                });
                setTimeout(function () {
                    joystick.on("dir", function (e, data) {
                        let dirs = ["up", "down", "left", "right"];
                        for (let o of dirs) {
                            if (o !== data.direction.angle) {
                                fakeInput.up(o);
                            } else {
                                fakeInput.down(o);
                            }
                        }
                    });
                    joystick.on("end", function () {
                        let dirs = ["up", "down", "left", "right"];
                        for (let o of dirs) {
                            fakeInput.up(o);
                        }
                    });
                }, 100);
                document.body.appendChild(zoneStatic);
                const createButton = (text, key, bottom, right, bgColor) => {
                    let button = document.createElement("div");
                    button.style = `
                    position: fixed; 
                    bottom: ${bottom}; 
                    right: ${right}; 
                    width: 10vw; 
                    height: 10vw; 
                    background: ${bgColor}; 
                    color: white; 
                    touch-action: none; 
                    z-index: 999999; 
                    display: flex; 
                    align-items: center; 
                    justify-content: center; 
                    font-family: sans-serif; 
                    font-size: 3vw;
                    border-radius: 50%;
                `;
                    button.innerText = text;
                    button.addEventListener("touchstart", function (e) {
                        e.preventDefault();
                        fakeInput.down(key);
                    });
                    button.addEventListener("touchend", function (e) {
                        e.preventDefault();
                        fakeInput.up(key);
                    });
                    document.body.appendChild(button);
                    return button;
                };

                createButton("OK", "ok", "5vw", "5vw", "#0f08");
                createButton("ESC", "escape", "5vw", "15vw", "#f008");
                createButton("TAG", "tag", "15vw", "15vw", "#00f8");
                createButton("RUN", "shift", "15vw", "5vw", "#f0f8");
                clearInterval(i);
            }
        }, 100);
        })();
    </script>
    


<style>
#ws-offline-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 9999;
  background: #0f172a;

}
#ws-offline-overlay.show { display: flex; }
#ws-offline-overlay h2 { font-size: 28px; margin: 0 0 8px; }
#ws-offline-overlay p { opacity: 0.6; font-size: 14px; margin: 0 0 20px; max-width: 320px; }
#ws-offline-overlay button {
  padding: 10px 24px; border-radius: 20px; border: none;
  background: #6366f1; color: #fff; font-size: 14px; cursor: pointer;
}
</style>
<div id="ws-offline-overlay">
  <div style="font-size:56px;">✈️</div>
  <h2>You're Offline</h2>
  <p>This game needs internet to load its assets. Connect to Wi-Fi and reload, or open a game that has been saved offline.</p>
  <button onclick="location.reload()">🔄 Retry</button>
</div>
<script>
(function() {
  function checkOffline() {
    if (!navigator.onLine) {
      document.getElementById('ws-offline-overlay').classList.add('show');
    }
  }
  checkOffline();
  window.addEventListener('offline', function() {
    document.getElementById('ws-offline-overlay').classList.add('show');
  });
  window.addEventListener('online', function() {
    document.getElementById('ws-offline-overlay').classList.remove('show');
  });
  // For iframe-based games: detect load failure
  var frames = document.querySelectorAll('iframe[src]');
  frames.forEach(function(f) {
    var src = f.getAttribute('src');
    if (!src || src.startsWith('data:')) return;
    // If offline, show overlay immediately
    if (!navigator.onLine) {
      document.getElementById('ws-offline-overlay').classList.add('show');
    }
  });
})();
</script>
