<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - WorkStudy</title>
    <link rel="icon" href="../img/game.png">
    <script src="../js/color.js" defer></script>
    <script src="../js/customTab.js" defer></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        #gameInfo {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 10px;
            padding: 6px 12px;
            pointer-events: none;
            line-height: 1.3;
        }

        #gameTitle {
            display: block;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            margin: 0;
        }

        #gameAuthor {
            display: block;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.65);
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="gameInfo">
        <span id="gameTitle"></span>
        <span id="gameAuthor"></span>
    </div>

    <div class="topbar">
        <button type="button" onclick="location.href='../games/index.html'">← Back to Games</button>
        <button type="button" onclick="location.href='../index.html'">🏠 Home</button>
        <button type="button" onclick="toggleGameFullscreen()">⛶ Fullscreen</button>
        <button type="button" onclick="openGameEmbed()">🗔 Open In New Tab</button>
    </div>

    <iframe id="websiteFrame" allow="fullscreen" allowfullscreen></iframe>

    <script>
        (function () {
            const name   = localStorage.getItem("gameName")   || "";
            const author = localStorage.getItem("gameAuthor") || "";
            const url    = localStorage.getItem("gameUrl")    || "";

            const titleEl  = document.getElementById("gameTitle");
            const authorEl = document.getElementById("gameAuthor");
            const frame    = document.getElementById("websiteFrame");

            if (titleEl)  titleEl.textContent  = name;
            if (authorEl) authorEl.textContent = author && author !== "Unknown" ? "by " + author : "";
            if (frame && url) frame.src = url;
        })();

        async function toggleGameFullscreen() {
            const frame = document.getElementById("websiteFrame");
            try {
                if (document.fullscreenElement) {
                    await document.exitFullscreen();
                } else {
                    await frame.requestFullscreen();
                }
            } catch (e) {
                console.error("Fullscreen failed:", e);
            }
        }

        function openGameEmbed() {
            const gameUrl  = localStorage.getItem("gameUrl");
            const gameName = localStorage.getItem("gameName") || "WorkStudy Game";

            if (!gameUrl) { alert("No game link was found."); return; }

            let validUrl;
            try {
                validUrl = new URL(gameUrl, window.location.href);
                if (validUrl.protocol !== "https:" && validUrl.protocol !== "http:") throw new Error();
            } catch {
                alert("The saved game link is invalid.");
                return;
            }

            const w = window.open("about:blank", "_blank");
            if (!w) { alert("The new tab was blocked. Allow popups and try again."); return; }

            w.document.title = gameName;
            w.document.body.style.cssText = "margin:0;width:100vw;height:100vh;overflow:hidden;background:#000";

            const f = w.document.createElement("iframe");
            f.src = validUrl.href;
            f.title = gameName;
            f.style.cssText = "display:block;width:100%;height:100%;border:0";
            f.setAttribute("allow", "fullscreen; autoplay");
            f.setAttribute("allowfullscreen", "");
            w.document.body.appendChild(f);
        }
    </script>

</body>
</html>
