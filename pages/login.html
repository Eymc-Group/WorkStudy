<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WorkStudy</title>
    <link rel="icon" href="../img/favicon.png">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/color.js" defer></script>
    <script src="../js/script.js" defer></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg, #0f172a);
            color: var(--text, #fff);
        }

        .container {
            width: min(420px, 90%);
            padding: 30px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.82);
            border: 2px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
        }

        h1 {
            margin: 0 0 20px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            background: rgba(31, 41, 55, 0.9);
            color: #fff;
        }

        input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--c1, #8b5cf6), var(--c2, #a855f7));
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            filter: brightness(1.08);
        }

        .links {
            margin-top: 18px;
            text-align: center;
            color: rgba(255,255,255,0.8);
        }

        .links a {
            color: #c4b5fd;
            text-decoration: none;
        }

        #status {
            margin-top: 15px;
            text-align: center;
            min-height: 22px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Login</h1>

        <input id="username" type="text" placeholder="Username">
        <input id="password" type="password" placeholder="Password">

        <div class="cf-turnstile" data-sitekey="0x4AAAAAAFhMfDnfOmB6YAzQ"></div>

        <button type="button" onclick="loginUser()">Login</button>

        <div id="status"></div>

        <div class="links">
            Don’t have an account?
            <a href="signup.html">Sign Up</a>
            <br><br>
            <a href="../index.html">🏠 Home</a>
        </div>
    </div>

    <script>
        async function loginUser() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const status = document.getElementById("status");

            if (!username) {
                status.textContent = "Enter a username.";
                return;
            }

            if (!password) {
                status.textContent = "Enter a password.";
                return;
            }

            status.textContent = "Logging in...";

            try {
                const response = await fetch("https://account-auth.354271744.workers.dev/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    const saved = window.WorkStudyAuth && typeof window.WorkStudyAuth.setCurrentUser === "function"
                        ? window.WorkStudyAuth.setCurrentUser(username)
                        : false;

                    if (!saved) {
                        try {
                            localStorage.setItem("workstudy-user", username);
                        } catch (error) {
                            console.error("Could not persist user session", error);
                        }
                    }

                    status.textContent = "Success!";
                    setTimeout(function () {
                        window.location.href = "../index.html";
                    }, 1000);
                    return;
                }

                status.textContent = data.message || "Login failed.";
            } catch (error) {
                console.error("Login request failed", error);
                status.textContent = "Connection failed.";
            }
        }
    </script>
</body>
</html>
