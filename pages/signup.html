<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - WorkStudy</title>

    <link rel="icon" href="../img/favicon.png">

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <script src="../js/auth.js" defer></script>
    <script src="../js/color.js" defer></script>
    <script src="../js/script.js" defer></script>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-container">
        <h1>📝 Sign Up</h1>

        <input id="username" type="text" placeholder="Username">

        <input id="password" type="password" placeholder="Password">

        <input id="confirmPassword" type="password" placeholder="Confirm Password">

        <div class="cf-turnstile"
             data-sitekey="0x4AAAAAAFhMfDnfOmB6YAzQ">
        </div>

        <button type="button" onclick="signupUser()">
            Create Account
        </button>

        <div id="status"></div>

        <div class="links">
            Already have an account?
            <a href="login.html">Login</a>

            <br><br>

            <a href="../index.html">🏠 Home</a>
        </div>
    </div>

    <script>
async function signupUser() {

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const status = document.getElementById("status");

    if (!username) {
        status.textContent = "Enter a username.";
        return;
    }

    if (!password) {
        status.textContent = "Enter a password.";
        return;
    }

    if (password !== confirmPassword) {
        status.textContent = "Passwords do not match.";
        return;
    }

    const token = turnstile.getResponse();

    if (!token) {
        status.textContent = "Please complete the Turnstile verification.";
        return;
    }

    status.textContent = "Creating account...";

    try {

        const response = await fetch(
            "https://workstudy-api.354271744.workers.dev/register",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    password,
                    token
                })
            }
        );

        const data = await response.json();

        if (data.success) {

            const saved =
                window.WorkStudyAuth &&
                typeof window.WorkStudyAuth.setCurrentUser === "function"
                    ? window.WorkStudyAuth.setCurrentUser(username)
                    : false;

            if (!saved) {
                try {
                    localStorage.setItem(
                        "workstudy-user",
                        username
                    );
                } catch (error) {
                    console.error(error);
                }
            }

            status.textContent =
                "Account created successfully!";

            setTimeout(() => {
                window.location.href =
                    "../index.html";
            }, 1000);

            return;
        }

        status.textContent =
            data.message ||
            "Unable to create account.";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Connection failed.";
    }
}
</script>
</body>
</html>
