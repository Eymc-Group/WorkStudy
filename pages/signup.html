<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - WorkStudy</title>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:400px;
    max-width:90%;
    background:#111827;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(168,85,247,.3);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#8b5cf6;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#7c3aed;
}

.links{
    text-align:center;
    margin-top:15px;
}

.links a{
    color:#a855f7;
    text-decoration:none;
}

#status{
    margin-top:15px;
    text-align:center;
}
</style>

</head>
<body>

<div class="container">

    <h1>✨ Create Account</h1>

    <input
        id="username"
        placeholder="Username">

    <input
        id="password"
        type="password"
        placeholder="Password">

    <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm Password">

    <div
        class="cf-turnstile"
        data-sitekey="0x4AAAAAAFhMfDnfOmB6YAzQ">
    </div>

    <button onclick="signup()">
        Create Account
    </button>

    <div id="status"></div>

    <div class="links">
        Already have an account?
        <a href="login.html">Login</a>

        <br><br>

        <a href="../index.html">🏠 Home</a>
    </div>

</div>

<script>
async function signup(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const status =
        document.getElementById("status");

    if(!username){
        status.textContent =
            "Enter a username.";
        return;
    }

    if(password.length < 4){
        status.textContent =
            "Password must be at least 4 characters.";
        return;
    }

    if(password !== confirmPassword){
        status.textContent =
            "Passwords do not match.";
        return;
    }

    status.textContent =
        "Creating account...";

    try{

        const response =
            await fetch(
                "https://account-auth.354271744.workers.dev/register",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        username,
                        password
                    })
                });

        const data =
            await response.json();

        if(data.success){

            status.textContent =
                "Account created! Redirecting...";

 setTimeout(()=>{
                location.href="login.html";
            },1500);

        }else{

            status.textContent =
                data.message;

        }

    }catch(error){

        status.textContent =
            "Connection failed.";

    }
}
</script>

</body>
</html>
