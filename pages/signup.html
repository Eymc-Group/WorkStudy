<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - WorkStudy</title>

    <link rel="icon" href="../img/favicon.png">
    <link rel="stylesheet" href="../css/style.css">

    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>

    <script src="../js/auth.js" defer></script>
    <script src="../js/color.js" defer></script>
    <script src="../js/script.js" defer></script>
</head>

<body>

    <div class="auth-container">

        <h1>📝 Sign Up</h1>

        <input
            id="username"
            type="text"
            placeholder="Username"
            minlength="3"
            maxlength="32"
            autocomplete="username"
            required
        >

        <input
            id="email"
            type="email"
            placeholder="Email Address"
            autocomplete="email"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
        >

        <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm Password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
        >

        <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAAFhMfDnfOmB6YAzQ">
        </div>

        <button id="signupBtn" type="button">
            Create Account
        </button>

        <div id="status" role="status" aria-live="polite"></div>

        <div class="links">
            Already have an account?
            <a href="login.html">Login</a>

            <br><br>

            <a href="../index.html">🏠 Home</a>
        </div>

    </div>

    <script>
        "use strict";

        const usernameInput =
            document.getElementById("username");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const signupButton =
            document.getElementById("signupBtn");

        const statusElement =
            document.getElementById("status");

        async function signupUser() {
            const username =
                usernameInput.value.trim();

            const email =
                emailInput.value.trim().toLowerCase();

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;

            if (!username) {
                statusElement.textContent =
                    "Enter a username.";
                usernameInput.focus();
                return;
            }

            if (
                username.length < 3 ||
                username.length > 32
            ) {
                statusElement.textContent =
                    "Username must be between 3 and 32 characters.";
                usernameInput.focus();
                return;
            }

            if (
                !/^[a-zA-Z0-9_-]+$/.test(username)
            ) {
                statusElement.textContent =
                    "Username may contain only letters, numbers, underscores, and hyphens.";
                usernameInput.focus();
                return;
            }

            if (!email) {
                statusElement.textContent =
                    "Enter an email address.";
                emailInput.focus();
                return;
            }

            if (!emailInput.validity.valid) {
                statusElement.textContent =
                    "Enter a valid email address.";
                emailInput.focus();
                return;
            }

            if (!password) {
                statusElement.textContent =
                    "Enter a password.";
                passwordInput.focus();
                return;
            }

            if (
                password.length < 8 ||
                password.length > 128
            ) {
                statusElement.textContent =
                    "Password must be between 8 and 128 characters.";
                passwordInput.focus();
                return;
            }

            if (password !== confirmPassword) {
                statusElement.textContent =
                    "Passwords do not match.";
                confirmPasswordInput.focus();
                return;
            }

            if (
                !window.turnstile ||
                typeof window.turnstile.getResponse !== "function"
            ) {
                statusElement.textContent =
                    "Turnstile is still loading. Try again.";
                return;
            }

            const turnstileToken =
                window.turnstile.getResponse();

  tion.";
                return;
            }

            signupButton.disabled = true;
            statusElement.textContent =
                "Creating account...";

            try {
                const response = await fetch(
                    "https://workstudy-api.354271744.workers.dev/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username,
                            email,
                            password,
                            token: turnstileToken
                        })
                    }
                );

                let data;

                try {
                    data = await response.json();
                } catch {
                    throw new Error(
                        "The server returned an invalid response."
                    );
                }

                if (!response.ok || !data.success) {
                    statusElement.textContent =
                        data.message ||
                        "Unable to create the account.";

                    if (
                        window.turnstile &&
                        typeof window.turnstile.reset === "function"
                    ) {
                        window.turnstile.reset();
                    }

                    return;
                }

                const account = {
                    username:
                        data.username || username,
                    email:
                        data.email || email
                };

                let saved = false;

                if (
                    window.WorkStudyAuth &&
                    typeof window.WorkStudyAuth.setCurrentUser === "function"
                ) {
                    saved =
                        window.WorkStudyAuth.setCurrentUser(
                            account
                        );
                }

                if (!saved) {
                    localStorage.setItem(
                        "workstudy-user",
                        JSON.stringify(account)
                    );
                }

                localStorage.setItem(
                    "workstudy-account",
                    JSON.stringify(account)
                );

                if (data.token) {
                    localStorage.setItem(
                        "workstudy-token",
                        data.token
                    );
                }

                statusElement.textContent =
                    "Account created successfully!";

                setTimeout(function () {
                    window.location.href =
                        "../index.html";
                }, 1000);

            } catch (error) {
                console.error(
                    "Registration failed:",
                    error
                );

                statusElement.textContent =
                    error.message ||
                    "Connection failed.";

                if (
                    window.turnstile &&
                    typeof window.turnstile.reset === "function"
                ) {
                    window.turnstile.reset();
                }

            } finally {
                signupButton.disabled = false;
            }
        }

        signupButton.addEventListener(
            "click",
            signupUser
        );

        document.addEventListener(
            "keydown",
            function (event) {
                if (
                    event.key === "Enter" &&
                    !signupButton.disabled
                ) {
                    signupUser();
                }
            }
        );
    </script>

</body>
</html>
