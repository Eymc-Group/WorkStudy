<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - WorkStudy</title>

    <link rel="icon" href="../img/favicon.png">
    <link rel="stylesheet" href="../css/style.css">

    <script src="../js/auth.js" defer></script>
    <script src="../js/color.js" defer></script>
    <script src="../js/script.js defer></script>
</head>

<body>

    <form
        id="loginForm"
        class="auth-container"
        novalidate
    >
        <h1>🔐 Login</h1>

        <input
            id="login"
            name="login"
            type="text"
            placeholder="Username or Email"
            autocomplete="username"
            maxlength="254"
            required
        >

        <input
            id="password"
            name="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            maxlength="128"
            required
        >

        <button id="loginBtn" type="submit">
            Login
        </button>

        <div
            id="status"
            role="status"
            aria-live="polite"
        ></div>

        <div class="links">
            Don't have an account?
            <a href="signup.html">Sign Up</a>

            <br><br>

            <a href="../index.html">🏠 Home</a>
        </div>
    </form>

    <script>
        "use strict";

        const loginForm =
            document.getElementById("loginForm");

        const loginInput =
            document.getElementById("login");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginBtn");

        const statusElement =
            document.getElementById("status");

        function setStatus(message) {
            statusElement.textContent = message;
        }

        async function loginUser(event) {
            event.preventDefault();

            const login =
                loginInput.value.trim();

            const password =
                passwordInput.value;

            if (!login) {
                setStatus("Enter a username or email.");
                loginInput.focus();
                return;
            }

            if (!password) {
                setStatus("Enter a password.");
                passwordInput.focus();
                return;
            }

            loginButton.disabled = true;
            setStatus("Logging in...");

            try {
                const response = await fetch(
      method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username: login,
                            password
                        })
                    }
                );

                let data;

                try {
                    data = await response.json();
                } catch {
                    throw new Error(
                        "The server returned an invalid response."
                    );
                }

                if (!response.ok || !data.success) {
                    setStatus(
                        data.message ||
                        "Login failed."
                    );

                    return;
                }

                const account = {
                    username:
                        data.username || login,

                    email:
                        data.email || null
                };

                let sessionSaved = false;

                if (
                    window.WorkStudyAuth &&
                    typeof window.WorkStudyAuth.setCurrentUser === "function"
                ) {
                    sessionSaved =
                        window.WorkStudyAuth.setCurrentUser(
                            account
                        );
                }

                if (!sessionSaved) {
                    localStorage.setItem(
                        "workstudy-user",
                        JSON.stringify(account)
                    );
                }

                localStorage.setItem(
                    "workstudy-account",
                    JSON.stringify(account)
                );

                if (data.token) {
                    localStorage.setItem(
                        "workstudy-token",
                        data.token
                    );
                } else {
                    localStorage.removeItem(
                        "workstudy-token"
                    );
                }

                setStatus("Login successful!");

                setTimeout(function () {
                    window.location.href =
                        "../index.html";
                }, 1000);

            } catch (error) {
                console.error(
                    "Login request failed:",
                    error
                );

                setStatus(
                    error.message ||
                    "Connection failed."
                );

            } finally {
                loginButton.disabled = false;
            }
        }

        loginForm.addEventListener(
            "submit",
            loginUser
        );
    </script>

</body>
</html>
