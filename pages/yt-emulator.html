<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YouTube – WorkStudy</title>
<link rel="icon" href="../img/favicon.png">
<script src="../js/color.js" defer></script>
<script src="../js/customTab.js" data-title="YouTube — WorkStudy" data-icon="../img/favicon.png" defer></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
    background: #0f0f0f; color: #f1f1f1;
    font-family: system-ui, sans-serif;
  }

  /* ── Topbar ── */
  #topbar {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    background: rgba(15,15,15,0.97);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0; z-index: 10;
  }

  .tb-btn {
    padding: 6px 12px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.08);
    color: #f1f1f1; font-size: 12px;
    font-family: inherit; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
    transition: background .15s;
  }
  .tb-btn:hover { background: rgba(255,255,255,0.15); }

  #url-wrap {
    flex: 1; display: flex; gap: 6px; align-items: center;
  }
  #yt-url-input {
    flex: 1;
    padding: 6px 12px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.4); color: #f1f1f1;
    font-size: 13px; outline: none;
    transition: border .2s;
  }
  #yt-url-input:focus { border-color: #ff0000; }
  #go-btn {
    padding: 6px 14px; border-radius: 20px; border: none;
    background: #ff0000; color: #fff; font-size: 13px;
    font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  #go-btn:hover { background: #cc0000; }

  /* Quick links */
  #quick-bar {
    display: flex; gap: 6px; padding: 5px 10px;
    background: rgba(15,15,15,0.95);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    overflow-x: auto; flex-shrink: 0;
    scrollbar-width: none;
  }
  #quick-bar::-webkit-scrollbar { display: none; }
  .ql-btn {
    padding: 4px 12px; border-radius: 20px; border: none;
    background: rgba(255,255,255,0.08); color: #f1f1f1;
    font-size: 12px; cursor: pointer; white-space: nowrap;
    transition: background .15s; flex-shrink: 0;
  }
  .ql-btn:hover { background: rgba(255,0,0,0.3); }

  /* Frame */
  #frame-wrap { flex: 1; position: relative; }
  #yt-frame {
    position: absolute; inset: 0;
    width: 100%; height: 100%; border: none;
  }

  /* Toast */
  #ws-toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: rgba(30,30,30,0.95); color: #f1f1f1;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 8px 20px; font-size: 13px;
    z-index: 9999; pointer-events: none;
    transition: transform .3s ease, opacity .3s ease; opacity: 0;
  }
  #ws-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div id="topbar">
  <button class="tb-btn" onclick="location.href='../index.html'">🏠 Home</button>
  <div id="url-wrap">
    <input id="yt-url-input" type="text"
      placeholder="youtube.com URL or search term…"
      value="https://www.youtube.com"
      autocomplete="off" spellcheck="false"
      onkeydown="if(event.key==='Enter')navigate()">
    <button id="go-btn" onclick="navigate()">Go</button>
  </div>
  <button class="tb-btn" onclick="goHome()">▶ YouTube</button>
  <button class="tb-btn" onclick="openNewTab()">↗ New Tab</button>
</div>

<div id="quick-bar">
  <button class="ql-btn" onclick="goTo('https://www.youtube.com')">🏠 Home</button>
  <button class="ql-btn" onclick="goTo('https://www.youtube.com/feed/trending')">🔥 Trending</button>
  <button class="ql-btn" onclick="goTo('https://www.youtube.com/shorts/')">📱 Shorts</button>
  <button class="ql-btn" onclick="goTo('https://www.youtube.com/feed/subscriptions')">🔔 Subscriptions</button>
  <button class="ql-btn" onclick="goTo('https://www.youtube.com/playlist?list=WL')">🕐 Watch Later</button>
  <button class="ql-btn" onclick="goTo('https://music.youtube.com')">🎵 YT Music</button>
  <button class="ql-btn" onclick="goTo('https://www.youtube.com/gaming')">🎮 Gaming</button>
  <button class="ql-btn" onclick="searchYT('MrBeast')">MrBeast</button>
  <button class="ql-btn" onclick="searchYT('music 2025')">Music</button>
  <button class="ql-btn" onclick="searchYT('minecraft')">Minecraft</button>
</div>

<div id="frame-wrap">
  <iframe id="yt-frame"
    src="https://www.youtube.com"
    allow="autoplay; fullscreen; picture-in-picture; accelerometer; gyroscope; encrypted-media"
    allowfullscreen
    title="YouTube"></iframe>
</div>

<div id="ws-toast"></div>

<script>
var frame = document.getElementById('yt-frame');
var input = document.getElementById('yt-url-input');

function sanitize(raw) {
  var url = (raw || '').trim();
  if (!url) return 'https://www.youtube.com';
  // Plain search term (no dot, no slash protocol)
  if (!/^https?:\/\//i.test(url) && !/\./.test(url)) {
    return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(url);
  }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  return url;
}

function navigate() {
  var url = sanitize(input.value);
  input.value = url;
  frame.src = url;
}

function goTo(url) {
  input.value = url;
  frame.src = url;
}

function goHome() {
  goTo('https://www.youtube.com');
}

function searchYT(q) {
  var url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
  input.value = url;
  frame.src = url;
}

function openNewTab() {
  var url = sanitize(input.value);
  var w = window.open(url, '_blank');
  if (!w) showToast('Popup blocked — allow popups for this site.');
}

// Handle ?url= param (from home searchbar redirects)
try {
  var sp = new URLSearchParams(location.search);
  var pUrl = sp.get('url') || sp.get('q');
  if (pUrl) {
    var resolved = sanitize(pUrl);
    input.value = resolved;
    frame.src = resolved;
  }
} catch(e) {}

var _toastTimer;
function showToast(msg) {
  var t = document.getElementById('ws-toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3000);
}
</script>
</body>
</html>
