<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WorkStudy</title>

    <link rel="icon" href="../img/favicon.png">

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <script src="../js/auth.js" defer></script>
    <script src="../js/color.js" defer></script>
    <script src="../js/script.js" defer></script>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="auth-container">

        <h1>🔐 Login</h1>

        <input
            id="username"
            type="text"
            placeholder="Username or Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAAFhMfDnfOmB6YAzQ">
        </div>

        <button
            type="button"
            onclick="loginUser()">
            Login
        </button>

        <div id="status"></div>

        <div class="links">
            Don't have an account?
            <a href="signup.html">Sign Up</a>

            <br><br>

            <a href="../index.html">🏠 Home</a>
        </div>

    </div>

    <script>

    document.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            loginUser();
        }
    });

    async function loginUser() {

        const username =
            document.getElementById("username")
            .value
            .trim();

        const password =
            document.getElementById("password")
            .value;

        const status =
            document.getElementById("status");

        if (!username) {
            status.textContent =
                "Enter a username or email.";
            return;
        }

        if (!password) {
            status.textContent =
                "Enter a password.";
            return;
        }

        status.textContent =
            "Logging in...";

        try {

            const response =
                await fetch(
                    "https://workstudy-api.354271744.workers.dev/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            username,
                            password
                        })
                    }
                );

            const data =
                await response.json();

            if (data.success) {

                const saved =
                    window.WorkStudyAuth &&
                    typeof window.WorkStudyAuth.setCurrentUser === "function"
                        ? window.WorkStudyAuth.setCurrentUser({
                              username: data.username,
                              email: data.email         localStorage.setItem(
                            "workstudy-user",
                            JSON.stringify({
                                username: data.username,
                                email: data.email
                            })
                        );

                    } catch (error) {

                        console.error(
                            "Could not persist user session",
                            error
                        );
                    }
                }

                try {

                    localStorage.setItem(
                        "workstudy-account",
                        JSON.stringify({
                            username: data.username,
                            email: data.email
                        })
                    );

                } catch (error) {

                    console.error(
                        "Could not save user data",
                        error
                    );
                }

                status.textContent =
                    "Success!";

                setTimeout(() => {
                    window.location.href =
                        "../index.html";
                }, 1000);

                return;
            }

            status.textContent =
                data.message ||
                "Login failed.";

        } catch (error) {

            console.error(
                "Login request failed",
                error
            );

            status.textContent =
                "Connection failed.";
        }
    }

    </script>

</body>
</html>
