<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - WorkStudy</title>
    <link rel="icon" href="../../img/favicon.png">
    <script src="../../js/color.js" defer></script>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: var(--bg, #0f172a);
            color: var(--text, #fff);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .chat-shell {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.72);
            border: 2px solid rgba(168, 85, 247, 0.5);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .chat-header h1 {
            margin: 0;
            font-size: 2rem;
        }

        .chat-messages {
            min-height: 360px;
            max-height: 50vh;
            overflow-y: auto;
            padding: 14px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.75);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 14px;
            line-height: 1.4;
            background: rgba(139, 92, 246, 0.18);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .message.self {
            align-self: flex-end;
            background: rgba(59, 130, 246, 0.18);
            border-color: rgba(96, 165, 250, 0.35);
        }

        .composer {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .composer input {
            flex: 1;
            padding: 12px 14px;
            border: none;
            border-radius: 12px;
            background: rgba(31, 41, 55, 0.9);
            color: #fff;
        }

        .composer button {
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--c1, #8b5cf6), var(--c2, #a855f7));
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chat-shell">
        <div class="chat-header">
            <h1>💬 WorkStudy Chat</h1>
            <button type="button" onclick="location.href='../../index.html'">🏠 Home</button>
        </div>

        <div id="chatMessages" class="chat-messages" aria-live="polite"></div>

        <div class="composer">
            <input id="chatInput" type="text" maxlength="300" placeholder="Type a message..." />
            <button type="button" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "workstudy-chat-messages";
        const chatMessages = document.getElementById("chatMessages");
        const chatInput = document.getElementById("chatInput");
        const sendBtn = document.getElementById("sendBtn");

        function getMessages() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
                return Array.isArray(saved) ? saved : [];
            } catch (error) {
                return [];
            }
        }

        function saveMessages(messages) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
        }

        function renderMessages() {
            const messages = getMessages();
            chatMessages.innerHTML = "";

            messages.forEach((message) => {
                const item = document.createElement("div");
                item.className = "message" + (message.self ? " self" : "");
                item.textContent = message.text;
                chatMessages.appendChild(item);
            });

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addMessage(text, self = false) {
            const messages = getMessages();
            messages.push({ text, self });
            saveMessages(messages);
            renderMessages();
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) {
                return;
            }

            addMessage(text, true);
            chatInput.value = "";

            setTimeout(function () {
                addMessage("Echo: " + text, false);
            }, 300);
        }

        sendBtn.addEventListener("click", sendMessage);
        chatInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        if (!getMessages().length) {
            addMessage("Welcome to WorkStudy Chat!", false);
        }

        renderMessages();
    </script>
</body>
</html>
