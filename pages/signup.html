<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - WorkStudy</title>

    <link rel="icon" href="../img/favicon.png">
    <link rel="stylesheet" href="../css/style.css">

    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>

    <script src="../js/auth.js" defer></script>
    <script src="../js/color.js" defer></script>
    <script src="../js/customTab.js" defer></script>
</head>

<body>

    <form
        id="signupForm"
        class="auth-container"
        novalidate
    >
        <h1>📝 Sign Up</h1>

        <input
            id="username"
            name="username"
            type="text"
            placeholder="Username"
            autocomplete="username"
            minlength="3"
            maxlength="32"
            required
        >

        <input
            id="email"
            name="email"
            type="email"
            placeholder="Email Address"
            autocomplete="email"
            maxlength="254"
            required
        >

        <input
            id="password"
            name="password"
            type="password"
            placeholder="Password"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            required
        >

        <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="Confirm Password"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            required
        >

        <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAAFhMfDnfOmB6YAzQ">
        </div>

        <button id="signupBtn" type="submit">
            Create Account
        </button>

        <div class="oauth-divider"><span>or</span></div>

        <button id="githubSignupBtn" type="button" class="btn-github">
            <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            Sign up with GitHub
        </button>

        <div
            id="status"
            role="status"
            aria-live="polite">
        </div>

        <div class="links">
            Already have an account?
            <a href="login.html">Login</a>

            <br><br>

            <a href="../index.html">🏠 Home</a>
        </div>
    </form>

    <script>
        "use strict";

        const signupForm =
            document.getElementById("signupForm");

        const usernameInput =
            document.getElementById("username");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const signupButton =
            document.getElementById("signupBtn");

        const statusElement =
            document.getElementById("status");

        function setStatus(message) {
            statusElement.textContent = message;
        }

        function resetTurnstile() {
            if (
                window.turnstile &&
                typeof window.turnstile.reset === "function"
            ) {
                window.turnstile.reset();
            }
        }

        async function signupUser(event) {
            event.preventDefault();

            const username =
                usernameInput.value.trim();

            const email =
                emailInput.value.trim().toLowerCase();

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;

            if (!username) {
                setStatus("Enter a username.");
                usernameInput.focus();
                return;
            }

            if (
                username.length < 3 ||
                username.length > 32
            ) {
                setStatus(
                    "Username must be between 3 and 32 characters."
                );

                usernameInput.focus();
                return;
            }

            if (!/^[a-zA-Z0-9_-]+$/.test(username)) {
                setStatus(
                    "Username may contain only letters, numbers, underscores, and hyphens."
                );

            atus("Enter an email address.");
                emailInput.focus();
                return;
            }

            if (!emailInput.validity.valid) {
                setStatus("Enter a valid email address.");
                emailInput.focus();
                return;
            }

            if (!password) {
                setStatus("Enter a password.");
                passwordInput.focus();
                return;
            }

            if (
                password.length < 8 ||
                password.length > 128
            ) {
                setStatus(
                    "Password must be between 8 and 128 characters."
                );

                passwordInput.focus();
                return;
            }

            if (password !== confirmPassword) {
                setStatus("Passwords do not match.");
                confirmPasswordInput.focus();
                return;
            }

            if (
                !window.turnstile ||
                typeof window.turnstile.getResponse !== "function"
            ) {
                setStatus(
                    "Turnstile is still loading. Try again."
                );

                return;
            }

            const turnstileToken =
                window.turnstile.getResponse();

            if (!turnstileToken) {
                setStatus(
                    "Please complete the Turnstile verification."
                );

                return;
            }

            signupButton.disabled = true;
            setStatus("Creating account...");

            try {
                const response = await fetch(
                    "https://workstudy-api.354271744.workers.dev/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username,
                            email,
                            password,
                            token: turnstileToken
                        })
                    }
                );

                let data;

                try {
                    data = await response.json();
                } catch {
                    throw new Error(
                        "The server returned an invalid response."
                    );
                }

                if (!response.ok || !data.success) {
                    setStatus(
                        data.message ||
                        "Unable to create the account."
                    );

                    resetTurnstile();
                    return;
                }

                const account = {
                    username: data.username || username,
                    email: data.email || email
                };

                let sessionSaved = false;

                if (
                    window.WorkStudyAuth &&
                    typeof window.WorkStudyAuth.setCurrentUser === "function"
                ) {
                    sessionSaved =
                        window.WorkStudyAuth.setCurrentUser(
                            account
                        );
                }

                if (!sessionSaved) {
                    localStorage.setItem(
                        "workstudy-user",
                        JSON.stringify(account)
                    );
                }

                localStorage.setItem(
                    "workstudy-account",
                    JSON.stringify(account)
                );

                if (data.token) {
                    localStorage.setItem(
                        "workstudy-token",
                        data.token
                    );
                } else {
                    localStorage.removeItem(
                        "workstudy-token"
                    );
                }

                setStatus(
                    "Account created successfully!"
                );

                setTimeout(function () {
                    window.location.href =
                        "../index.html";
                }, 1000);

            } catch (error) {
                console.error(
                    "Registration failed:",
                    error
                );

                setStatus(
                    error.message ||
                    "Connection failed."
                );

                resetTurnstile();

            } finally {
                signupButton.disabled = false;
            }
        }

        signupForm.addEventListener(
            "submit",
            signupUser
        );

        const githubSignupBtn =
            document.getElementById("githubSignupBtn");

        if (githubSignupBtn) {
            githubSignupBtn.addEventListener("click", function () {
                sessionStorage.setItem("gh-oauth-intent", "signup");
                window.location.href =
                    "https://workstudy-api.354271744.workers.dev/auth/github?intent=signup";
            });
        }
    </script>

</body>
</html>
