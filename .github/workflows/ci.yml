name: Validate Website

on:
  push:
    branches:
      - root
  pull_request:
    branches:
      - root
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate HTML, CSS, links, and images
        uses: anishathalye/proof-html@v2
        with:
          directory: .
          disable_external: true
          enforce_https: true
