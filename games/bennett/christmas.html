<!DOCTYPE html><html lang="en-us"><head><style>@font-face{font-family:"ScSans";font-weight:400;font-style:normal;font-display:block;src:url("fonts/sc-400.woff2") format("woff2")}@font-face{font-family:"ScSans";font-weight:500;font-style:normal;font-display:block;src:url("fonts/sc-500.woff2") format("woff2")}@font-face{font-family:"ScSans";font-weight:600;font-style:normal;font-display:block;src:url("fonts/sc-600.woff2") format("woff2")}.sc-f{font-family:"ScSans",sans-serif!important;text-transform:none!important;font-variant:normal!important;font-variant-caps:normal!important}.sc-f::before,.sc-f::after{font-family:var(--sc-pf,inherit)!important}</style>

    
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Christmas Massacre</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: black;
      }
      #gameContainer, #gameContainer canvas {
        width: 100vw !important;
        height: 100vh !important;
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
      }
      #loading-text {
  font-weight: bold;
  background: linear-gradient(
    270deg,
    #ff0000,
    #ff7f00,
    #ffff00,
    #00ff00,
    #0000ff,
    #4b0082,
    #8f00ff
  );
  background-size: 400% 400%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbow 3s ease infinite;
}

@keyframes rainbow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
    </style>
    </head><body><div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;" class="sc-f"> LOADING...
  </div>
    
    



  
    <div id="gameContainer"></div>
  
</body></html>
