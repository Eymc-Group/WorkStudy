<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notepad – WorkStudy</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { margin:0; display:flex; flex-direction:column; height:100vh; background:var(--bg,#0f0f1a); color:var(--text,#e2e8f0); font-family:'Pusab',system-ui,sans-serif; }
  #toolbar { display:flex; align-items:center; gap:6px; padding:8px 12px; background:rgba(0,0,0,0.3); border-bottom:1px solid rgba(255,255,255,0.08); flex-wrap:wrap; }
  #toolbar button { background:rgba(255,255,255,0.08); color:var(--text,#e2e8f0); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:inherit; transition:background .15s; }
  #toolbar button:hover { background:rgba(255,255,255,0.15); }
  #toolbar button.active { background:var(--c1,#6366f1); border-color:var(--c1,#6366f1); }
  #fileNameBar { display:flex; align-items:center; gap:8px; padding:6px 12px; background:rgba(0,0,0,0.2); border-bottom:1px solid rgba(255,255,255,0.05); font-size:12px; opacity:0.6; }
  #fileName { flex:1; background:none; border:none; outline:none; color:var(--text,#e2e8f0); font-family:inherit; font-size:12px; }
  #editor { flex:1; padding:16px 20px; font-size:15px; font-family:'Courier New',monospace; color:var(--text,#e2e8f0); background:transparent; border:none; outline:none; resize:none; line-height:1.6; white-space:pre-wrap; word-break:break-word; overflow-y:auto; }
  #statusBar { display:flex; gap:16px; padding:5px 14px; background:rgba(0,0,0,0.3); border-top:1px solid rgba(255,255,255,0.05); font-size:11px; opacity:0.5; }
  #openFileInput { display:none; }
  .back-btn { position:fixed; top:12px; left:12px; z-index:999; background:rgba(0,0,0,0.5); color:#fff; border:1px solid rgba(255,255,255,0.15); border-radius:10px; padding:6px 12px; font-size:12px; cursor:pointer; text-decoration:none; }
</style>
</head>
<body>
<a class="back-btn" href="../index.html">← Back</a>

<div id="toolbar">
  <strong style="font-size:13px;margin-right:4px;">📝 Notepad</strong>
  <button onclick="newFile()">🆕 New</button>
  <button onclick="openFile()">📂 Open</button>
  <input id="openFileInput" type="file" accept=".txt,.md,.js,.html,.css,.json,.csv,.log,.xml,.yaml,.yml" onchange="loadFile(this)">
  <button onclick="saveFile()">💾 Save</button>
  <button onclick="saveAs()">📄 Save As</button>
  <button onclick="copyAll()">📋 Copy All</button>
  <button onclick="clearAll()">🗑️ Clear</button>
  <select id="fontSel" onchange="document.getElementById('editor').style.fontSize=this.value+'px'" style="background:rgba(255,255,255,0.08);color:var(--text,#e2e8f0);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:5px 8px;font-family:inherit;font-size:12px;cursor:pointer;">
    <option value="12">12px</option>
    <option value="14">14px</option>
    <option value="15" selected>15px</option>
    <option value="16">16px</option>
    <option value="18">18px</option>
    <option value="20">20px</option>
  </select>
  <button id="wrapBtn" onclick="toggleWrap()" class="active">⇄ Wrap</button>
</div>

<div id="fileNameBar">
  <span>📄</span>
  <input id="fileName" type="text" value="untitled.txt" title="File name">
  <span id="savedIndicator" style="color:#4ade80;">✓ Saved</span>
</div>

<textarea id="editor" placeholder="Start typing…" spellcheck="false" oninput="onEdit()"></textarea>

<div id="statusBar">
  <span id="charCount">0 chars</span>
  <span id="lineCount">1 line</span>
  <span id="wordCount">0 words</span>
  <span id="selCount"></span>
</div>

<script>
var wrap = true;
var saved = true;
var autoSaveKey = 'ws-notepad-autosave';

// Autosave restore
var autosaved = localStorage.getItem(autoSaveKey);
if (autosaved) {
  try {
    var d = JSON.parse(autosaved);
    document.getElementById('editor').value = d.content || '';
    document.getElementById('fileName').value = d.name || 'untitled.txt';
  } catch(e) {}
}

function onEdit() {
  saved = false;
  document.getElementById('savedIndicator').textContent = '● Unsaved';
  document.getElementById('savedIndicator').style.color = '#facc15';
  updateStatus();
  localStorage.setItem(autoSaveKey, JSON.stringify({content: document.getElementById('editor').value, name: document.getElementById('fileName').value}));
  saved = true;
  document.getElementById('savedIndicator').textContent = '✓ Autosaved';
  document.getElementById('savedIndicator').style.color = '#4ade80';
}

function updateStatus() {
  var txt = document.getElementById('editor').value;
  document.getElementById('charCount').textContent = txt.length + ' chars';
  document.getElementById('lineCount').textContent = txt.split('\n').length + ' lines';
  document.getElementById('wordCount').textContent = (txt.match(/\S+/g)||[]).length + ' words';
}

function newFile() {
  if (!confirm('Start a new file? Unsaved changes will be lost.')) return;
  document.getElementById('editor').value = '';
  document.getElementById('fileName').value = 'untitled.txt';
  updateStatus();
}

function openFile() { document.getElementById('openFileInput').click(); }

function loadFile(input) {
  var f = input.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById('editor').value = e.target.result;
    document.getElementById('fileName').value = f.name;
    updateStatus();
  };
  reader.readAsText(f);
  input.value = '';
}

function saveFile() {
  var content = document.getElementById('editor').value;
  var name = document.getElementById('fileName').value || 'untitled.txt';
  var blob = new Blob([content], {type:'text/plain'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  document.getElementById('savedIndicator').textContent = '✓ Downloaded';
  document.getElementById('savedIndicator').style.color = '#4ade80';
}

function saveAs() {
  var name = prompt('Save as:', document.getElementById('fileName').value || 'untitled.txt');
  if (!name) return;
  document.getElementById('fileName').value = name;
  saveFile();
}

function copyAll() {
  navigator.clipboard.writeText(document.getElementById('editor').value).then(function(){
    alert('Copied to clipboard!');
  });
}

function clearAll() {
  if (!confirm('Clear all text?')) return;
  document.getElementById('editor').value = '';
  updateStatus();
}

function toggleWrap() {
  wrap = !wrap;
  var ed = document.getElementById('editor');
  ed.style.whiteSpace = wrap ? 'pre-wrap' : 'pre';
  ed.style.overflowX = wrap ? 'hidden' : 'auto';
  document.getElementById('wrapBtn').classList.toggle('active', wrap);
}

// Selection stats
document.getElementById('editor').addEventListener('select', function() {
  var start = this.selectionStart, end = this.selectionEnd;
  if (end > start) document.getElementById('selCount').textContent = (end-start)+' selected';
  else document.getElementById('selCount').textContent = '';
});

// Tab key
document.getElementById('editor').addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    var start = this.selectionStart, end = this.selectionEnd;
    this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
    this.selectionStart = this.selectionEnd = start + 2;
  }
  if ((e.ctrlKey||e.metaKey) && e.key === 's') { e.preventDefault(); saveFile(); }
});

updateStatus();
</script>
</body>
</html>
