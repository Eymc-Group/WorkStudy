<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Game - WorkStudy</title>

    <link
        rel="icon"
        href="../img/game.png"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <script
        src="../js/color.js"
        defer>
    </script>

    <script
        src="../js/gameFrameSave.js"
        defer>
    </script>
</head>

<body>
    <h1 id="gameTitle">
        Loading Game...
    </h1>

    <p id="gameAuthor"></p>

    <iframe
        id="websiteFrame"
        title="WorkStudy Game"
        allow="fullscreen; autoplay"
    ></iframe>

    <div class="topbar">
        <button
            id="saveGameBtn"
            type="button"
        >
            🎮💾 Save Game Progress
        </button>

        <button
            id="restoreGameBtn"
            type="button"
        >
            📥 Restore Game Progress
        </button>

        <button
            id="backToGamesBtn"
            type="button"
        >
            ← Back to Games
        </button>

        <button
            id="homeBtn"
            type="button"
        >
            🏠 Home
        </button>
    </div>

    <p
        id="gameSaveStatus"
        role="status"
        aria-live="polite"
    ></p>
</body>
</html>
