    <div id="gameContainer">

        <script src="Build/V0.1.loader.js"></script>
        <script>
            function mergeFiles(fileParts) {
                return new Promise((resolve, reject) => {
                    let buffers = [];

                    function fetchPart(index) {
                        if (index >= fileParts.length) {
                            let mergedBlob = new Blob(buffers);
                            let mergedFileUrl = URL.createObjectURL(mergedBlob);
                            resolve(mergedFileUrl);
                            return;
                        }
                        fetch(fileParts[index]).then(response => response.arrayBuffer()).then(data => {
                            buffers.push(data);
                            fetchPart(index + 1);
                        }).catch(reject);
                    }
                    fetchPart(0);
                });
            }
            var parts = ["Build/V0.1.wasm.part1", "Build/V0.1.wasm.part2"];
            Promise.all([
                mergeFiles(parts)
            ]).then(([mergedUrl]) => {
                var canvas = document.querySelector("#unity-canvas");
                var config = {
                    dataUrl: "Build/V0.1.data",
                    frameworkUrl: "Build/V0.1.framework.js",
                    codeUrl: mergedUrl,
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "eli_hoffman",
                    productName: "Flappy Bird Multiplayer",
                    productVersion: "0.1",
                };
                var scaleToFit;
                try {
                    scaleToFit = !!JSON.parse("");
                } catch (e) {
                    scaleToFit = true;
                }

                function progressHandler(progress) {
                    var percent = progress * 100 + '%';
                    canvas.style.background = 'linear-gradient(to right, white, white ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';
                    canvas.style.backgroundSize = '100% 1rem';
                }

                function onResize() {
                    var container = canvas.parentElement;
                    var w;
                    var h;
                    if (scaleToFit) {
                        w = window.innerWidth;
                        h = window.innerHeight;
                        var r = 800 / 600;
                        if (w * r > window.innerHeight) {
                            w = Math.min(w, Math.ceil(h / r));
                        }
                        h = Math.floor(w * r);
                    } else {
                        w = 600;
                        h = 800;
                    }
                    container.style.width = canvas.style.width = w + "px";
                    container.style.height = canvas.style.height = h + "px";
                    container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
                    container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
                }
                createUnityInstance(canvas, config, progressHandler).then(function (instance) {
                    canvas = instance.Module.canvas;
                    onResize();
                });
                window.addEventListener('resize', onResize);
                onResize();
                if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                    // Mobile device style: fill the whole browser client area with the game canvas:
                    const meta = document.createElement('meta');
                    meta.name = 'viewport';
                    meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
                    document.getElementsByTagName('head')[0].appendChild(meta);
                }
            }).catch(error => {
                console.error(error);
            });
        </script>

<div id="ws-offline-overlay">
  <div style="font-size:56px;">✈️</div>
  <h2>You're Offline</h2>
  <p>This game needs internet to load its assets. Connect to Wi-Fi and reload, or open a game that has been saved offline.</p>
  <button onclick="location.reload()">🔄 Retry</button>
</div>
<script>
(function() {
  function checkOffline() {
    if (!navigator.onLine) {
      document.getElementById('ws-offline-overlay').classList.add('show');
    }
  }
  checkOffline();
  window.addEventListener('offline', function() {
    document.getElementById('ws-offline-overlay').classList.add('show');
  });
  window.addEventListener('online', function() {
    document.getElementById('ws-offline-overlay').classList.remove('show');
  });
  // For iframe-based games: detect load failure
  var frames = document.querySelectorAll('iframe[src]');
  frames.forEach(function(f) {
    var src = f.getAttribute('src');
    if (!src || src.startsWith('data:')) return;
    // If offline, show overlay immediately
    if (!navigator.onLine) {
      document.getElementById('ws-offline-overlay').classList.add('show');
    }
  });
})();
</script>
